<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo CLI 邮箱验证码</title>
</head>
<body style="margin:0;background:#f5f7fb;color:#263247;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
  <div style="max-width:560px;margin:32px auto;padding:32px;border:1px solid #e5eaf1;border-radius:12px;background:#fff;">
    <h1 style="margin:0 0 20px;color:#245bdb;font-size:22px;">Kairo CLI</h1>
    <p style="margin:0 0 16px;line-height:1.7;">你正在进行邮箱验证，本次验证码为：</p>
    <div style="margin:20px 0;padding:18px;border-radius:8px;background:#eef4ff;color:#245bdb;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;">{{code}}</div>
    <p style="margin:0;line-height:1.7;color:#667085;">验证码 {{minutes}} 分钟内有效，请勿转发给他人。如非本人操作，请忽略此邮件。</p>
  </div>
</body>
</html>
